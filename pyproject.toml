[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onca"
version = "0.2.0"
description = "Open-source Network Crawler for Assets — ferramenta de descoberta de ativos web"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Yaguarete (Matheus Aguiar)", email = "matheus.gamar@gmail.com" },
]
keywords = ["security", "crawler", "subdomains", "osint", "recon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "requests>=2.32.0,<3.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "python-whois>=0.9.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "responses>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/MatheusAguiar3/ONCA---Open-source-Network-Crawler-for-Assets"
Repository = "https://github.com/MatheusAguiar3/ONCA---Open-source-Network-Crawler-for-Assets"
Issues = "https://github.com/MatheusAguiar3/ONCA---Open-source-Network-Crawler-for-Assets/issues"

[project.scripts]
onca = "onca.cli:main"

[tool.setuptools.packages.find]
include = ["onca*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
